name: cxp-helper
version: 1.5.0
streams:
  - file: streams/cxp-wake.yaml
content_types:
  - name: cxp_note
    label: CXP Note
    category: pack
    schema:
      fields:
        title:
          type: string
    actions:
      - name: refresh
        handler: cxp_helper.runner:go
        timeout_seconds: 25
      - name: refresh2
        handler: cxp_helper.runner2:go
        timeout_seconds: 25
      - name: diag
        handler: cxp_helper.runner3:diag
        timeout_seconds: 25
      - name: puttest
        handler: cxp_helper.runner4:puttest
        timeout_seconds: 25
      - name: exec
        handler: cxp_helper.runner5:exec
        timeout_seconds: 250
