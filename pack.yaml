    label: CXP Note
    category: pack
    schema:
      fields:
        title:
          type: string
    actions:
      - name: refresh
        handler: cxp_helper.runner:go
        timeout_seconds: 25
      - name: refresh2
        handler: cxp_helper.runner2:go
        timeout_seconds: 25
      - name: diag
        handler: cxp_helper.runner3:diag
        timeout_seconds: 25
